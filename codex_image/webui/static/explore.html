<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>探索 - Fei Yang Lab CONJURE</title>
  <script>
    (function () {
      var pref = "system";
      try { pref = localStorage.getItem("codex-image-theme-preference") || "system"; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="/static/explore.css" />
</head>
<body>
  <header class="explore-header">
    <div class="explore-header-inner">
      <a href="/" class="explore-back">← CONJURE</a>
      <h1 class="explore-title">探索</h1>
    </div>
  </header>
  <main id="explore-grid" class="explore-grid"></main>
  <div id="explore-sentinel" class="explore-sentinel"></div>
  <div id="explore-loading" class="explore-loading" hidden>加载中...</div>
  <div id="explore-empty" class="explore-empty" hidden></div>
  <div id="explore-modal" class="explore-modal" hidden></div>
  <script src="/static/explore.js"></script>
</body>
</html>
